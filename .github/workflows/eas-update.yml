# ينشر التطبيق على EAS Update عشان تفتحه من Expo Go على الجوال.
# - كل Pull Request: ينشر نسخة معاينة ويحط تعليق فيه QR ورابط.
# - كل دمج في main: ينشر النسخة الأساسية.
# يحتاج سر EXPO_TOKEN في إعدادات المستودع (Settings > Secrets and variables > Actions).
name: EAS Update

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: تأكد من وجود EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::ما لقيت EXPO_TOKEN في أسرار المستودع. شوف README."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # يربط المشروع بحسابك في expo.dev (ينشئه أول مرة لو مو موجود).
      - name: اربط المشروع
        run: |
          eas init --non-interactive --force
          eas update:configure --platform ios --non-interactive || true
          node -e "const a=require('./app.json');console.log('projectId:', a.expo.extra?.eas?.projectId)"

      - name: معاينة الـ Pull Request
        if: github.event_name == 'pull_request'
        uses: expo/expo-github-action/preview@v8
        with:
          command: eas update --auto --branch pr-${{ github.event.number }} --platform ios --non-interactive

      - name: نشر main
        if: github.event_name != 'pull_request'
        run: eas update --auto --branch main --platform ios --non-interactive
