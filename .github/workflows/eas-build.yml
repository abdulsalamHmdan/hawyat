# يبني نسخة الآيفون الكاملة ويرفعها لـ TestFlight (تشغيل يدوي من Actions).
# يحتاج حساب Apple Developer مدفوع.
#
# الأسرار المطلوبة:
#   EXPO_TOKEN
#   ASC_API_KEY          محتوى ملف .p8 من App Store Connect > Users and Access > Integrations > App Store Connect API
#   ASC_KEY_ID           رقم المفتاح
#   ASC_ISSUER_ID        Issuer ID من نفس الصفحة
#   APPLE_TEAM_ID        من developer.apple.com > Membership
# المتغيرات: SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, ASC_APP_ID (رقم التطبيق في App Store Connect)
name: نسخة TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci

      - name: مفتاح App Store Connect
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          printf '%s' "$ASC_API_KEY" > "$RUNNER_TEMP/asc.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc.p8" >> "$GITHUB_ENV"

      - name: اربط المشروع
        run: eas init --non-interactive --force

      # البناء على خوادم Expo ثم الرفع لـ TestFlight تلقائيًا
      - name: ابنِ وارفع
        run: |
          node -e "
            const fs = require('fs'), j = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            j.build.production.env = {
              EXPO_PUBLIC_SUPABASE_URL: process.env.EXPO_PUBLIC_SUPABASE_URL || '',
              EXPO_PUBLIC_SUPABASE_KEY: process.env.EXPO_PUBLIC_SUPABASE_KEY || '',
            };
            if (process.env.ASC_APP_ID) j.submit.production = { ios: { ascAppId: process.env.ASC_APP_ID } };
            fs.writeFileSync('eas.json', JSON.stringify(j, null, 2));
          "
          eas build --platform ios --profile production --non-interactive --auto-submit --wait

      # تحديثات EAS Update تروح لنسخة TestFlight من فرع main
      - name: اربط قناة production بفرع main
        run: eas channel:edit production --branch main --non-interactive || eas channel:create production --non-interactive || true
