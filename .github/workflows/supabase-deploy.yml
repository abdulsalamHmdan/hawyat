# ينشر قاعدة البيانات على Supabase: الهجرات (الجداول والخصوصية والمهام المجدولة)،
# ورسالة رمز الدخول، وإعدادات الإيميل (لو حطيت بيانات Gmail).
# يشتغل لما يتغير شي في supabase/ على main، أو يدويًا من Actions.
#
# أسرار المستودع المطلوبة (Settings > Secrets and variables > Actions > Secrets):
#   SUPABASE_ACCESS_TOKEN   من supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD    كلمة مرور قاعدة البيانات اللي اخترتها لما سويت المشروع
#   SMTP_USER, SMTP_PASS    (اختياري) إيميل Gmail و«كلمة مرور التطبيقات» عشان يوصل رمز الدخول لكل الشباب
# متغيرات المستودع (Variables):
#   SUPABASE_PROJECT_REF    رمز المشروع (من رابط المشروع)
name: نشر قاعدة البيانات

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - name: تأكد من الإعدادات
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::error::ناقص:$missing (شوف README)"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: الهجرات
        run: npx -y supabase@3 db push --remote="$REF" --password "$SUPABASE_DB_PASSWORD" --skip-vault --yes

      - name: رسالة رمز الدخول وإعدادات الإيميل
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          body=$(node -e '
            const fs = require("fs");
            const html = fs.readFileSync("supabase/templates/otp.html", "utf8");
            const cfg = {
              mailer_otp_length: 6,
              mailer_otp_exp: 3600,
              mailer_subjects_magic_link: "رمز الدخول للحاويات",
              mailer_templates_magic_link_content: html,
              mailer_subjects_confirmation: "رمز الدخول للحاويات",
              mailer_templates_confirmation_content: html,
            };
            if (process.env.SMTP_USER && process.env.SMTP_PASS) {
              Object.assign(cfg, {
                smtp_host: "smtp.gmail.com",
                smtp_port: "465",
                smtp_user: process.env.SMTP_USER,
                smtp_pass: process.env.SMTP_PASS,
                smtp_admin_email: process.env.SMTP_USER,
                smtp_sender_name: "الحاويات",
                rate_limit_email_sent: 60,
              });
            }
            process.stdout.write(JSON.stringify(cfg));
          ')
          code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$body")
          echo "HTTP $code"
          if [ "$code" -ge 300 ]; then
            head -c 500 /tmp/resp.json
            echo "::error::ما قدرنا نحدّث إعدادات الإيميل"
            exit 1
          fi
          if [ -z "$SMTP_USER" ]; then
            echo "::warning::ما فيه SMTP_USER/SMTP_PASS: رمز الدخول بيوصل لأعضاء فريق Supabase بس. شوف README."
          fi
