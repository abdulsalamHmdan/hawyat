<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>قطة مناسبة جديدة</title>

<link rel="stylesheet" href="../web/tokens.css">
<link rel="stylesheet" href="../web/bundle.css">
</head>
<body>


<style>
body{margin:0}
a{color:#4e5e2c}a:hover{color:#2a2118}
</style>

<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">

<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; padding: 52px 16px 16px; min-height: 0;">

<div style="display: flex; align-items: center; justify-content: space-between;">
<h1 style="margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 34px;">قطة جديدة</h1>
<a href="05-qatta-member.html" aria-label="إغلاق" style="width: 44px; height: 44px; border-radius: 9999px; background: var(--surface-sunken); color: var(--ink); display: flex; align-items: center; justify-content: center;">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
</a>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="title" style="font-size: 14px; line-height: 20px; font-weight: 600;">وش القطة؟</label>
<input id="title" type="text" value="عشاء الجمعة" style="height: 52px; box-sizing: border-box; border: 1.5px solid var(--line-strong); border-radius: 14px; background: var(--surface-raised); padding: 0 16px; font: inherit; font-size: 16px; color: var(--ink);">
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 14px; line-height: 20px; font-weight: 600;">المبلغ</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--surface-sunken); border-radius: 14px;">
<button style="min-height: 44px; border: 0; border-radius: 11px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: var(--ink-muted); cursor: pointer;">لكل شخص</button>
<button style="min-height: 44px; border: 0; border-radius: 11px; background: var(--surface-raised); box-shadow: var(--shadow-card); font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); cursor: pointer;">مبلغ كامل يتقسم</button>
</div>
<div style="display: flex; align-items: center; height: 60px; border: 1.5px solid var(--line-strong); border-radius: 14px; background: var(--surface-raised); padding: 0 16px; gap: 8px;">
<label for="amount" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">المبلغ الكامل</label>
<input id="amount" type="text" inputmode="numeric" value="270" style="flex-grow: 1; min-width: 0; border: 0; background: transparent; font-family: var(--font-display); font-weight: 700; font-size: 28px; color: var(--ink);">
<span style="font-size: 16px; color: var(--ink-muted);">ريال</span>
</div>
<span style="font-size: 14px; line-height: 20px; color: var(--olive); font-weight: 600;">نصيب كل واحد 45 ريال</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 14px; line-height: 20px; font-weight: 600;">مين معك فيها؟ <span style="font-weight: 400; color: var(--ink-muted);">6 من 7</span></span>
<div class="hw-replies">
<button class="hw-reply hw-reply--on" aria-pressed="true">أنت</button>
<button class="hw-reply hw-reply--on" aria-pressed="true">محمد</button>
<button class="hw-reply hw-reply--on" aria-pressed="true">خالد</button>
<button class="hw-reply hw-reply--on" aria-pressed="true">فهد</button>
<button class="hw-reply hw-reply--on" aria-pressed="true">سعد</button>
<button class="hw-reply hw-reply--on" aria-pressed="true">نايف</button>
<button class="hw-reply" aria-pressed="false">بدر</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 14px; line-height: 20px; font-weight: 600;">آخر موعد للدفع</span>
<div class="hw-replies">
<button class="hw-reply">بكرة</button>
<button class="hw-reply hw-reply--on">بعد 3 أيام</button>
<button class="hw-reply">أسبوع</button>
<button class="hw-reply">تاريخ ثاني</button>
</div>
</div>

<div style="display: flex; gap: 10px; align-items: center; font-size: 13px; line-height: 20px; color: var(--ink-muted);">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
يوصلهم إشعار الحين، وتذكير كل يومين لين يضغطون «دفعت». حالاتهم تشوفها أنت بس.
</div>

<button class="hw-btn hw-btn--primary hw-btn--block" style="min-height: 56px; font-size: 17px; margin-top: auto;">انشر القطة</button>

</div>

</div>


</body>
</html>
