<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>وصلت المخيم: الدعوة</title>

<link rel="stylesheet" href="../web/tokens.css">
<link rel="stylesheet" href="../web/bundle.css">
</head>
<body>


<style>
body{margin:0}
a{color:#4e5e2c}a:hover{color:#2a2118}
</style>

<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(30, 26, 21, 0.55); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">

<div style="background: var(--surface-raised); border-radius: 24px 24px 0 0; box-shadow: var(--shadow-sheet); padding: 12px 20px 32px; display: flex; flex-direction: column; gap: 20px;">
<div style="width: 40px; height: 5px; border-radius: 9999px; background: var(--line); align-self: center;"></div>

<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
<div style="display: flex; flex-direction: column;">
<h1 style="margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 34px;">وصلت المخيم</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">وش تبي تقول للشباب؟</p>
</div>
<button aria-label="إغلاق" style="width: 44px; height: 44px; border-radius: 9999px; border: 0; background: var(--surface-sunken); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none;">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
</button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--surface-sunken); border-radius: 14px;">
<button style="min-height: 44px; border: 0; border-radius: 11px; background: var(--surface-raised); box-shadow: var(--shadow-card); font: inherit; font-size: 15px; font-weight: 700; color: var(--ink); cursor: pointer;">وصلت وموجود</button>
<button style="min-height: 44px; border: 0; border-radius: 11px; background: transparent; font: inherit; font-size: 15px; font-weight: 600; color: var(--ink-muted); cursor: pointer;">رايح الحين</button>
</div>

<div style="display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 14px; line-height: 20px; font-weight: 600;">تعزمهم على شي؟</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;">
<button style="min-height: 76px; border-radius: 16px; border: 1.5px solid var(--olive); background: var(--olive); color: var(--on-olive); font: inherit; font-size: 14px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.116 4.104A1 1 0 0 1 6.11 3h11.78a1 1 0 0 1 .994 1.105L17.19 20.21A2 2 0 0 1 15.2 22H8.8a2 2 0 0 1-2-1.79z"/><path d="M6 12a5 5 0 0 1 6 0 5 5 0 0 0 6 0"/></svg>شاهي</button>
<button style="min-height: 76px; border-radius: 16px; border: 1.5px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg>قهوة</button>
<button style="min-height: 76px; border-radius: 16px; border: 1.5px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>عشاء</button>
<button style="min-height: 76px; border-radius: 16px; border: 1.5px solid var(--line-strong); background: var(--surface-raised); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12.5" cy="8.5" r="2.5"/><path d="M12.5 2a6.5 6.5 0 0 0-6.22 4.6c-1.1 3.13-.78 3.9-3.18 6.08A3 3 0 0 0 5 18c4 0 8.4-1.8 11.4-4.3A6.5 6.5 0 0 0 12.5 2Z"/><path d="m18.5 6 2.19 4.5a6.48 6.48 0 0 1 .31 2 6.49 6.49 0 0 1-2.6 5.2C15.4 20.2 11 22 7 22a3 3 0 0 1-2.68-1.66L2.4 16.5"/></svg>شوي</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px;">
<span style="font-size: 14px; line-height: 20px; font-weight: 600;">متى؟</span>
<div class="hw-replies">
<button class="hw-reply hw-reply--on">الحين</button>
<button class="hw-reply">9:30م</button>
<button class="hw-reply">10:00م</button>
<button class="hw-reply">وقت ثاني</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="msg" style="font-size: 14px; line-height: 20px; font-weight: 600;">رسالة للشباب <span style="font-weight: 400; color: var(--ink-muted);">(اختياري)</span></label>
<input id="msg" type="text" value="النار مشبوبة، تعالوا" style="height: 52px; box-sizing: border-box; border: 1.5px solid var(--line-strong); border-radius: 14px; background: var(--surface-raised); padding: 0 16px; font: inherit; font-size: 16px; color: var(--ink);">
</div>

<div style="display: flex; align-items: center; gap: 12px; background: var(--surface-sunken); border-radius: 14px; padding: 12px 14px;">
<img src="../../assets/images/icon.png" alt="" style="width: 36px; height: 36px; border-radius: 9px; flex: none;">
<div style="display: flex; flex-direction: column; min-width: 0;">
<b style="font-size: 14px; line-height: 20px;">عبدالسلام وصل المخيم · عازمكم على شاهي</b>
<span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">النار مشبوبة، تعالوا</span>
</div>
</div>

<button class="hw-btn hw-btn--ember hw-btn--block" style="min-height: 56px; font-size: 17px;">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>بلّغ الشباب</button>
</div>

</div>


</body>
</html>
