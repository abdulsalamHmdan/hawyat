<div style="background: var(--surface-raised); border-radius: 16px; box-shadow: var(--shadow-card); padding: 16px; display: flex; flex-direction: column; gap: 10px;">

<div style="flex-grow: 1; display: flex; flex-direction: column;"><b style="font-size: 16px; line-height: 24px;">محمد</b><span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">ضغط دفعت · أمس 8:15م</span></div>
