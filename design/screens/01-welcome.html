<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>الترحيب والدخول</title>

<link rel="stylesheet" href="../web/tokens.css">
<link rel="stylesheet" href="../web/bundle.css">
</head>
<body>


<style>
body{margin:0}
a{color:#4e5e2c}a:hover{color:#2a2118}
</style>

<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--night); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">

<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 48px 32px 32px; color: var(--sand); text-align: center;">
<img src="../../assets/logo/hawiyat-mark-reverse.svg" alt="" style="width: 132px; height: auto;">
<h1 style="margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 48px; line-height: 56px;">الحاويات</h1>
<p style="margin: 0; font-size: 16px; line-height: 26px; opacity: .85; max-width: 260px;">القطة والعزايم والحضور، كلها بمكان واحد وبدون إحراج.</p>
</div>

<div style="background: var(--surface-raised); border-radius: 24px 24px 0 0; padding: 32px 24px 40px; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<h2 style="margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 32px;">سجّل برقم جوالك</h2>
<p style="margin: 0; font-size: 14px; line-height: 22px; color: var(--ink-muted);">بنرسل لك رمز من 4 أرقام</p>
</div>
<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="phone" style="font-size: 14px; line-height: 20px; font-weight: 600;">رقم الجوال</label>
<div style="display: flex; align-items: center; height: 56px; border: 1.5px solid var(--line-strong); border-radius: 14px; background: var(--surface-raised); overflow: hidden;">
<input id="phone" type="tel" placeholder="05X XXX XXXX" style="flex-grow: 1; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0 16px; font: inherit; font-size: 18px; color: var(--ink); direction: ltr; text-align: right;">
<span style="height: 100%; display: flex; align-items: center; padding: 0 16px; border-inline-start: 1px solid var(--line); color: var(--ink-muted); font-size: 16px; direction: ltr;">+966</span>
</div>
</div>
<button class="hw-btn hw-btn--primary hw-btn--block" style="min-height: 56px; font-size: 17px;">أرسل الرمز</button>
<div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px; line-height: 22px;">
<span style="color: var(--ink-muted);">عندك كود دعوة من الشباب؟</span>
<a href="#" style="font-weight: 600; text-decoration: none;">انضم بالكود</a>
</div>
</div>

</div>


</body>
</html>
